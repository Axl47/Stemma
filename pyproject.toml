[project]
name = "audio-embed-engine"
version = "0.1.0"
description = "Tracks -> Deezer previews -> cached audio embeddings (Discogs-EffNet)"
readme = "README.md"
authors = [
    { name = "Axl47", email = "axelorta2153@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
bench = [
    "av>=19.0.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    {include-group = "fetch"},
]
# Full-track downloads from YouTube Music (bench/fetch_youtube.py). `deno` is yt-dlp's JS runtime.
fetch = [
    "deno>=2.9.8",
    "yt-dlp[default]>=2026.10.26",
    "ytmusicapi>=1.12.3",
]
dev = [
    "essentia>=2.1b6.dev1438",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
audio-embed = "audio_embed_engine.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"bench/*" = ["SIM115", "RUF007"]  # one-off scripts

[tool.pyright]
include = ["src", "tests"]
